# Site settings
title: Prácticas ASIR2 
repository: miolca/asir2-sgd
description: >-
  Assignmets docs for asir2
title: "ASIR2 DOC 2026/27"
markdown: GFM

plugins:
- jekyll-gfm-admonitions
- jekyll-optional-front-matter

theme: jekyll-theme-hacker

collections:
  tutorials:
    output: true
    permalink: /:collection/:name
  extra:
    output: true
    permalink: /:collection/:name



exclude: 
  - "**/*.ts" # Exclude source code files!
  - "**/*.js"
  - "*.ts" # Also those in the root directory!
  - "*.js"
  - "*.json" # Don't forget about assets!
  - node_modules/ # And large vendored directories
  # And these ignore all the artifacts the build produces:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
